<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-label="Godot installer terminal preview with release and location selection">
  <rect width="760" height="310" rx="6" fill="#101820"/>
  <g font-family="DejaVu Sans Mono,monospace" font-size="14" fill="#d5e1eb">
    <text x="28" y="31" font-weight="bold">Choose a release</text>
    <text x="28" y="55" fill="#91a4b6">  ↑/↓ or j/k · Enter · q cancel</text>
    <rect x="20" y="68" width="720" height="28" rx="4" fill="#19384b"/>
    <text x="28" y="87" fill="#68c6eb" font-weight="bold">  › 4.7.2-stable · recommended</text>
    <text x="28" y="114">    4.8-beta1 · unstable</text>
    <text x="28" y="141">    4.8-dev7 · unstable</text>
    <text x="28" y="186" font-weight="bold">Install location</text>
    <text x="28" y="210" fill="#91a4b6">  ↑/↓ or j/k · Enter · q cancel</text>
    <text x="28" y="239" fill="#68c6eb" font-weight="bold">  › Only me · ~/.local/bin</text>
    <text x="28" y="266">    All users · /usr/local/bin (sudo)</text>
    <text x="28" y="293">    Custom directory · only me</text>
  </g>
</svg>
