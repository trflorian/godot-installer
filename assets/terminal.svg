<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="Godot installer terminal preview with release and location selection">
  <rect width="760" height="430" rx="14" fill="#101820"/>
  <path d="M14 0h732a14 14 0 0 1 14 14v30H0V14A14 14 0 0 1 14 0" fill="#1d2b38"/>
  <g fill="#6a8093"><circle cx="22" cy="22" r="5"/><circle cx="40" cy="22" r="5"/><circle cx="58" cy="22" r="5"/></g>
  <text x="380" y="27" fill="#9badbd" text-anchor="middle" font-family="monospace" font-size="12">godot-installer</text>
  <g font-family="DejaVu Sans Mono,monospace" font-size="14" fill="#d5e1eb">
    <text x="28" y="80" fill="#68c6eb" font-size="19" font-weight="bold">Godot installer</text>
