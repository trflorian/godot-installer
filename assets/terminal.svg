<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-label="Godot installer terminal preview with release and location selection">
  <rect width="760" height="390" rx="14" fill="#101820"/>
  <g font-family="DejaVu Sans Mono,monospace" font-size="14" fill="#d5e1eb">
    <text x="28" y="40" fill="#68c6eb" font-size="19" font-weight="bold">Godot installer</text>
    <text x="28" y="68"><tspan fill="#89d5a2">Installed:</tspan> 4.7.2.stable.official</text>
    <text x="28" y="111" font-weight="bold">Choose a release</text>
    <text x="28" y="135" fill="#91a4b6">  ↑/↓ or j/k · Enter · q cancel</text>
    <rect x="20" y="148" width="720" height="28" rx="4" fill="#19384b"/>
    <text x="28" y="167" fill="#68c6eb" font-weight="bold">  › 4.7.2-stable · recommended</text>
    <text x="28" y="194">    4.8-beta1 · unstable</text>
    <text x="28" y="221">    4.8-dev7 · unstable</text>
    <text x="28" y="266" font-weight="bold">Install location</text>
    <text x="28" y="290" fill="#91a4b6">  ↑/↓ or j/k · Enter · q cancel</text>
    <text x="28" y="319" fill="#68c6eb" font-weight="bold">  › Only me · ~/.local/bin</text>
    <text x="28" y="346">    All users · /usr/local/bin (sudo)</text>
    <text x="28" y="373">    Custom directory · only me</text>
  </g>
</svg>
